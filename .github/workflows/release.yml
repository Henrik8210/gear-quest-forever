# Package and upload to CurseForge on version tag push.
# Add repo secret CF_API_KEY from https://authors.curseforge.com/#/settings/api-tokens
#
# WoW Forever is its own CurseForge game (1.60.1). BigWigs packager still maps
# 1.x → Classic Era and 16xxx → Retail, and move-folders fights package-as, so
# we zip GearQuest/ as GearQuestForever ourselves and upload to 1.60.1.
#
# Do not pass packager -g 2.5.6 (TBC) or -g 1.15.7 (Classic Era).

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zip GearQuestForever
        run: |
          set -euo pipefail
          mkdir -p .release/GearQuestForever
          rsync -a \
            --exclude '_generated/*.json' \
            --exclude '_generated/*.md' \
            GearQuest/ .release/GearQuestForever/
          (
            cd .release
            zip -X -r "GearQuestForever-${GITHUB_REF_NAME}.zip" GearQuestForever
          )
          unzip -l ".release/GearQuestForever-${GITHUB_REF_NAME}.zip" | head -n 20

      - name: Upload zip to CurseForge (WoW Forever 1.60.1)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1698950"
          CF_GAME_VERSION: "1.60.1"
        run: python3 scripts/upload-curseforge-forever.py
